<div class="wf-credential-list">
  {%- for item in items -%}
  <div class="wf-credential-row">
    <span class="wf-credential-label">{{ item.label }}</span>
    <span class="wf-credential-value">{{ item.value }}</span>
    <span class="{{ item.kind_class() }}">{{ item.status_label }}</span>
  </div>
  {%- endfor -%}
</div>
