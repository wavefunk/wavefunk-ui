<div class="wf-timeline">
  {%- for item in items -%}
  <div class="{{ item.class_name() }}">
    <div class="wf-timeline-time">{{ item.time }}</div>
    <div class="wf-timeline-title">{{ item.title }}</div>
    <div class="wf-timeline-body">{{ item.body_html }}</div>
  </div>
  {%- endfor -%}
</div>
